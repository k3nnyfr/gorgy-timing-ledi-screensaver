# Compile l'écran de veille et l'installeur sur un runner Linux (Mono + NSIS).
# - push sur main / pull request : installeur disponible en artefact
# - tag vX.Y.Z : version X.Y.Z appliquée, installeur publié dans une release Gitea
# Le .scr n'est pas livré séparément : l'installeur le contient.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Mono et NSIS
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update -qq
          $SUDO apt-get install -y -qq --no-install-recommends mono-devel nsis curl jq ca-certificates

      - name: Déterminer la version
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) VERSION="${GITHUB_REF#refs/tags/v}" ;;
            *) VERSION=$(sed -n 's/.*!define VERSION "\(.*\)"/\1/p' installer/GorgyLedi.nsi) ;;
          esac
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version invalide : '$VERSION' (attendu : X.Y.Z, tag vX.Y.Z)" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          sed -i "s/Version(\"[0-9.]*\")/Version(\"$VERSION.0\")/" src/AssemblyInfo.cs
          echo "Version : $VERSION"

      - name: Compiler l'écran de veille
        run: ./build.sh

      - name: Construire l'installeur
        run: |
          mkdir -p dist
          makensis -V2 -DVERSION="$VERSION" installer/GorgyLedi.nsi

      # Gitea ne prend pas en charge upload-artifact v4
      - uses: actions/upload-artifact@v3
        with:
          name: GorgyLedi-Setup-${{ env.VERSION }}
          path: dist/GorgyLedi-Setup-*.exe

      # Appel direct à l'API Gitea : les actions de release en Go demandent Go dans le runner
      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          AUTH="Authorization: token $TOKEN"
          # Release existante (relance du job) ou nouvelle
          ID=$(curl -fs -H "$AUTH" "$API/releases/tags/$TAG" | jq -r .id) || ID=
          if [ -z "$ID" ]; then
            ID=$(jq -n --arg tag "$TAG" --arg name "Version ${TAG#v}" '{tag_name: $tag, name: $name}' |
              curl -fsS -X POST -H "$AUTH" -H "Content-Type: application/json" -d @- "$API/releases" | jq -r .id)
          fi
          for f in dist/GorgyLedi-Setup-*.exe; do
            name=$(basename "$f")
            curl -fsS -X POST -H "$AUTH" -F "attachment=@$f" "$API/releases/$ID/assets?name=$name" > /dev/null
            echo "Publié : $name (release $TAG)"
          done
